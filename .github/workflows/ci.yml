name: build

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  linux-test:
    name: Test
    timeout-minutes: 30
    strategy:
      matrix:
        platform: [ubuntu-latest]
    runs-on: ${{ matrix.platform }}
    steps:
      - name: Install packages
        timeout-minutes: 5
        run: |
          for attempt in 1 2 3; do
            if sudo apt-get update \
                -o Acquire::Retries=3 \
                -o Acquire::http::Timeout=30 \
                -o Acquire::https::Timeout=30 && \
              sudo apt-get install -y sqlite3; then
              break
            fi

            if [ "$attempt" -eq 3 ]; then
              echo "Failed to install packages after $attempt attempts" >&2
              exit 1
            fi

            sleep $((attempt * 10))
          done
          sudo apt-get clean
          sudo rm -rf /var/lib/apt/lists/*

      - name: Free disk space
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: false
          android: true
          dotnet: true
          haskell: true
          large-packages: false
          docker-images: false
          swap-storage: false

      - name: Install aws-cli
        uses: isbang/setup-awscli@v0.1.0

      - name: Check out source code
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Decrypt secrets
        run: gpg --quiet --batch --yes --decrypt --passphrase="$GCP_CLIENT_SECRETS_PASSPHRASE" --output $GITHUB_WORKSPACE/client_secrets.json $GITHUB_WORKSPACE/client_secrets.json.gpg
        if: github.ref == 'refs/heads/main' && vars.ENABLE_BIGQUERY_INTEGRATION == 'true'
        env:
          GCP_CLIENT_SECRETS_PASSPHRASE: ${{ secrets.GCP_CLIENT_SECRETS_PASSPHRASE }}

      - name: Start databases
        run: |
          docker compose up -d
          sleep 20s
          docker compose ps

      - name: Run lint
        timeout-minutes: 10
        uses: reviewdog/action-golangci-lint@v2
        with:
          go_version_file: go.mod
          golangci_lint_version: v2.12.2
          reporter: github-pr-check
          cache: false

      - name: Run test
        run: make ci
        env:
          DEBUG: "true"

      - name: Run BigQuery integration
        run: make test_bigquery
        if: github.ref == 'refs/heads/main' && vars.ENABLE_BIGQUERY_INTEGRATION == 'true'

      - name: Run install script (aka use)
        run: sh use

      - name: Run Trivy vulnerability scanner in repo mode
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'

      - name: Run octocov
        uses: k1LoW/octocov-action@v1
        env:
          DEBUG: true
  windows-test:
    name: Test
    strategy:
      matrix:
        platform: [windows-2022, windows-latest]
    runs-on: ${{ matrix.platform }}
    steps:
      - name: Use LF
        run: |
          git config --global core.autocrlf false
          git config --global core.eol lf

      - name: Install packages
        run: |
          choco install sqlite

      - name: Install aws-cli
        uses: isbang/setup-awscli@v0.1.0

      - name: Check out source code
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Run tests
        run: |
          make ci_windows
        shell: bash
        env:
          DEBUG: "true"
