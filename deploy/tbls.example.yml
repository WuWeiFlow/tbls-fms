---
# tbls-fms 配置模板。复制为 .tbls.yml 后按实际数据库修改。

# 建议通过环境变量提供连接信息，避免将密码提交到 Git。
dsn: ${TBLS_DSN}
docPath: docs/database
# 虚拟关系告警会同时输出到控制台和 docs/virtual-relation-warnings.log。
# 日志位于 docPath 目录的同级，并在每次执行时覆盖。

# ER 图同时保留完整版和简化版：
# - schema.svg：完整图，保持 tbls 原有行为；
# - schema-compact.svg：简化图；README 默认展示简化图，并提供完整图链接；
# - 单表和 Viewpoint 同样生成完整版和 *-compact.svg 简化版，例如 sr_order.svg 和 sr_order-compact.svg；
# - 单表 Markdown、README 和 Viewpoint Markdown 默认展示简化图，并提供完整图链接。
er:
  format: svg
  # 在 ER 图中显示数据库里的表注释和字段注释；false 或不配置时只显示名称和类型。
  comment: true
  # 关系说明继续放在子表字段附近，但沿关系线向表外偏移，避免覆盖字段内容。
  # distance 是相对默认 10pt 的距离倍数；angle 控制相对关系线的偏移方向。
  # 若仍有重叠，可先增大 distance，再适当增大 nodeSep/rankSep。
  relationLabel:
    distance: 3.0
    angle: -90
  # 同一层表之间、不同层表之间的间距（英寸）；值越大，图也越大。
  nodeSep: 0.8
  rankSep: 0.8
  compact:
    enabled: true
    # 简化图始终显示主键和所有关联字段，并额外显示每张表最前面的 N 个普通字段。
    # 0 表示只显示主键和关联字段；建议从 0 或 3 开始调整。必须大于等于 0。
    maxColumns: 0

# 按第一个下划线前的表名前缀自动生成模块 Viewpoint，例如 sr_order -> sr。
moduleViewpoints:
  enabled: true
  separator: "_"
  # include 为空表示自动发现全部前缀；include/exclude 均支持 * 通配符。
  include: []
  exclude: [tmp, bak]
  # 跨模块模式只带入直接相连的一层表，不会递归扩散：
  # none    = 只显示本模块表；
  # parents = 本模块表 + 本模块直接引用的父表（推荐）；
  # all     = parents + 直接引用本模块的子表。
  crossModule: parents

# 如需为某个模块精确控制表或分组，可使用相同 id 的手动 Viewpoint 覆盖自动结果。
# 自动生成的 id 格式为 module-<前缀>，例如 sr 对应 module-sr。
# viewpoints:
#   - id: module-sr
#     name: SR 模块（手动）
#     desc: 手动维护的 SR 模块关系视图
#     tables: [sr_*, sys_biz_type, pa_staff]
#     distance: 0

# 将每张表的 Markdown 和单表 ER 图按表名前缀放入子目录。
# 例如 sr_order.md/sr_order.svg -> docs/database/sr/。
# README.md、schema.json、schema.svg、schema-compact.svg 和 Viewpoint 文件仍留在 docPath 根目录。
# 从旧版平铺目录首次升级时建议使用 tbls doc --rm-dist，删除旧位置的重复生成文件。
tableDirectories:
  enabled: true
  separator: "_"
  # 表名没有 separator 时放入该目录；不能使用 .、.. 或包含路径分隔符。
  fallback: other

# 符合 FMS 规则的关系会自动生成：
# sr_order_hrs.order_id -> sr_order.id_
# 唯一的跨模块表名后缀也会自动生成：
# sr_order.asset_id -> eq_asset.id_
detectVirtualRelations:
  enabled: true
  strategy: fms
  # 仅控制 FMS 自动识别关系在 ER 图边线上的文字。
  # 可用变量：{childTable}、{childColumn}、{parentTable}、{parentColumn}、
  # {cardinality}、{parentCardinality}。基数会缩写为 0..1、1、0..N、1..N。
  # rules[].def 和 relations[].def 仍分别控制映射规则和手动关系的文字。
  autoRelationDef: "{cardinality} : {parentCardinality} → {parentTable} (Auto)"

  # 无法仅凭名称可靠推导、但会在多张表重复出现的关系写在 rules 中。
  # tables 和 excludeTables 支持通配符；不写 tables 时匹配所有含该字段的表。
  # 父字段必须是主键，且子字段与父字段的数据库类型必须一致。
  # 不符合条件的单条关系会跳过并输出中文警告，不会中断整次文档生成。
  rules:
    - columns: [create_by, report_by, worker_id]
      parentTable: pa_staff
      parentColumn: id_
      def: "MAPPED: staff"

    - columns: [staff_team_id, work_team_id]
      parentTable: org_staff_structure
      parentColumn: id_
      def: "MAPPED: staff structure"

    - columns: [base_biz_type_id]
      parentTable: sys_biz_type
      parentColumn: id_
      def: "MAPPED: business type"

    # 可选的表范围示例：只匹配 sr_ 开头、且不是历史表的 category_id。
    # - tables: [sr_*]
    #   excludeTables: [sr_history_*]
    #   columns: [category_id]
    #   parentTable: sys_category
    #   parentColumn: id_

# 最终优先级：relations 手动指定 > rules 映射规则 > FMS 自动识别。
# 同一张表中未被高优先级关系占用的其他字段，仍会继续按低优先级识别。
# 最终输出会按子表统一分组；同一张表内保持手动 > rules > 自动的顺序。
relations:
  # 非标准关系示例：字段名无法按 FMS 规则推导。
  # - table: sr_order_hrs
  #   columns: [legacy_order_no]
  #   parentTable: sr_order
  #   parentColumns: [order_no]
  #   def: "MANUAL: legacy order number"

  # 覆盖自动判断示例：order_id 应指向 legacy_order，而不是 sr_order。
  # - table: sr_order_hrs
  #   columns: [order_id]
  #   parentTable: legacy_order
  #   parentColumns: [id_]
  #   def: "MANUAL: override FMS detection"

  # 复合关系示例：columns 与 parentColumns 按位置一一对应。
  # - table: sr_order_item
  #   columns: [tenant_id, order_no]
  #   parentTable: sr_order
  #   parentColumns: [tenant_id, order_no]
  #   def: "COMPOSITE: tenant + order number"

  # 多态关系示例：tbls 只负责文档展示，不会执行 owner_type 条件。
  # 应为同一字段分别配置可能的父表，并在 def 中写清判别条件。
  # - table: biz_attachment
  #   columns: [owner_id]
  #   parentTable: sr_order
  #   parentColumns: [id_]
  #   def: "POLYMORPHIC: owner_type = ORDER"
  # - table: biz_attachment
  #   columns: [owner_id]
  #   parentTable: crm_customer
  #   parentColumns: [id_]
  #   def: "POLYMORPHIC: owner_type = CUSTOMER"
