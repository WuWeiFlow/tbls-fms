---
# tbls-fms 配置模板。复制为 .tbls.yml 后按实际数据库修改。

# 建议通过环境变量提供连接信息，避免将密码提交到 Git。
dsn: ${TBLS_DSN}
docPath: docs/database

# 符合 FMS 规则的关系会自动生成：
# sr_order_hrs.order_id -> sr_order.id_
# 唯一的跨模块表名后缀也会自动生成：
# sr_order.asset_id -> eq_asset.id_
detectVirtualRelations:
  enabled: true
  strategy: fms

  # 无法仅凭名称可靠推导、但会在多张表重复出现的关系写在 rules 中。
  # tables 和 excludeTables 支持通配符；不写 tables 时匹配所有含该字段的表。
  # 父字段必须是主键，且子字段与父字段的数据库类型必须一致。
  # 不符合条件的单条关系会跳过并输出中文警告，不会中断整次文档生成。
  rules:
    - columns: [create_by, report_by, worker_id]
      parentTable: pa_staff
      parentColumn: id_
      def: "MAPPED: staff"

    - columns: [staff_team_id, work_team_id]
      parentTable: org_staff_structure
      parentColumn: id_
      def: "MAPPED: staff structure"

    - columns: [base_biz_type_id]
      parentTable: sys_biz_type
      parentColumn: id_
      def: "MAPPED: business type"

    # 可选的表范围示例：只匹配 sr_ 开头、且不是历史表的 category_id。
    # - tables: [sr_*]
    #   excludeTables: [sr_history_*]
    #   columns: [category_id]
    #   parentTable: sys_category
    #   parentColumn: id_

# 最终优先级：relations 手动指定 > rules 映射规则 > FMS 自动识别。
# 同一张表中未被高优先级关系占用的其他字段，仍会继续按低优先级识别。
relations:
  # 非标准关系示例：字段名无法按 FMS 规则推导。
  # - table: sr_order_hrs
  #   columns: [legacy_order_no]
  #   parentTable: sr_order
  #   parentColumns: [order_no]
  #   def: "MANUAL: legacy order number"

  # 覆盖自动判断示例：order_id 应指向 legacy_order，而不是 sr_order。
  # - table: sr_order_hrs
  #   columns: [order_id]
  #   parentTable: legacy_order
  #   parentColumns: [id_]
  #   def: "MANUAL: override FMS detection"

  # 复合关系示例：columns 与 parentColumns 按位置一一对应。
  # - table: sr_order_item
  #   columns: [tenant_id, order_no]
  #   parentTable: sr_order
  #   parentColumns: [tenant_id, order_no]
  #   def: "COMPOSITE: tenant + order number"

  # 多态关系示例：tbls 只负责文档展示，不会执行 owner_type 条件。
  # 应为同一字段分别配置可能的父表，并在 def 中写清判别条件。
  # - table: biz_attachment
  #   columns: [owner_id]
  #   parentTable: sr_order
  #   parentColumns: [id_]
  #   def: "POLYMORPHIC: owner_type = ORDER"
  # - table: biz_attachment
  #   columns: [owner_id]
  #   parentTable: crm_customer
  #   parentColumns: [id_]
  #   def: "POLYMORPHIC: owner_type = CUSTOMER"

lint:
  duplicateRelations:
    enabled: true
